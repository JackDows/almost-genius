name: Windows 安装包
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
defaults:
  run:
    working-directory: jira-reminder
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: jira-reminder/package-lock.json
      - name: 校验版本并构建安装包
        shell: powershell
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag 与 package.json 版本不一致' }
          ./packaging/Build-Release.ps1
      - name: 安装、升级和卸载验证
        shell: powershell
        run: ./packaging/Smoke-Install.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: JiraWorkReminder-Windows-x64
          path: |
            jira-reminder/dist/*Setup-x64.exe
            jira-reminder/dist/SHA256SUMS.txt
      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = (Get-ChildItem dist -File).FullName
          $ErrorActionPreference = 'Continue'
          gh release view $env:GITHUB_REF_NAME --json tagName *> $null
          $exists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = 'Stop'
          if ($exists) {
            gh release upload $env:GITHUB_REF_NAME $files --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $files --verify-tag --generate-notes --title "Jira 工作提醒 $env:GITHUB_REF_NAME"
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release 发布失败' }
